name: Android Debug APK (Capacitor + Gradle)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install npm dependencies
        run: npm ci

      - name: Vite build (web assets)
        run: npm run build

      - name: Capacitor sync (copy web assets + plugins into android project)
        run: npx --yes cap sync android

      - name: Gradle wrapper permissions
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List outputs
        run: find ./android/app/build/outputs/apk -name '*.apk' -type f -printf 'APK: %p %s bytes\n'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 30
