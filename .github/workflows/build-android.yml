name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build web app
      run: npm run build
    
    - name: Sync web resources to Android
      run: npx cap sync android
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '21'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Make gradlew executable
      run: chmod +x ./android/gradlew

    - name: Create keystore file from GitHub Secrets
      id: create_keystore
      run: |
        set +e  # 暂时关闭严格错误，让我们做合法性校验
        KS="android/my-release-key.keystore"
        PASS="${{ secrets.KEYSTORE_PASSWORD }}"
        READY="false"
        # 先清理上次残留
        rm -f "$KS"
        # 尝试 base64 解码（GitHub Actions 会自动把 secrets 替换成真实值写入脚本）
        B64="${{ secrets.KEYSTORE_BASE64 }}"
        if [ -n "$B64" ]; then
          echo "$B64" | base64 -d > "$KS" 2>/dev/null
        fi
        # 合法性检测：文件大小 > 1KB 且 keytool -list 能通过密码打开 + alias 存在
        if [ -f "$KS" ]; then
          SIZE=$(stat -c%s "$KS" 2>/dev/null || echo 0)
          if [ "$SIZE" -gt 1000 ]; then
            echo "检测到 keystore 候选文件（大小 ${SIZE}B），尝试用密码验证..."
            keytool -list -keystore "$KS" -storepass "$PASS" -alias jingxunianjing >/dev/null 2>&1
            RC=$?
            if [ "$RC" -eq 0 ]; then
              echo "✅ keystore 合法（密码正确，alias=jingxunianjing 存在）→ 允许 Release 构建"
              READY="true"
              # 展示别名信息 & 文件大小（便于排障）
              echo "=== Keystore file details ==="
              ls -la "$KS"
              file "$KS"
              echo "=== Listing aliases in keystore ==="
              keytool -list -keystore "$KS" -storepass "$PASS" 2>/dev/null || true
            else
              echo "⚠️  检测到 keystore 但密码错误或 alias 不存在（keytool 返回 $RC）→ 跳过 Release 构建（仅 Debug）"
            fi
          else
            echo "⚠️  生成的 keystore 过小（${SIZE}B），判定为无效（可能 KEYSTORE_BASE64 不是合法的 base64 编码 JKS）→ 跳过 Release 构建（仅 Debug）"
          fi
        else
          echo "ℹ️  未检测到 my-release-key.keystore（KEYSTORE_BASE64 未配置或解码失败）→ 跳过 Release 构建（仅 Debug）"
        fi
        # 若无效就删掉，避免 build.gradle 里的 if(keystoreFile.exists()) 错误挂 signingConfig
        if [ "$READY" != "true" ]; then
          rm -f "$KS"
        fi
        # 输出 step output，给后续 step 做 if 调度（完全绕开 secrets mask 带来的判空失效）
        echo "ready=$READY" >> "$GITHUB_OUTPUT"
        echo "GITHUB_OUTPUT 设置 ready=$READY"
        set -e

    - name: Extract SHA1 from keystore
      run: |
        if [ ! -f android/my-release-key.keystore ]; then
          echo "ℹ️  未检测到 my-release-key.keystore — 跳过证书指纹提取"
          exit 0
        fi
        cd android
        echo "# 将 base64 编码的 keystore 还原为文件"
        echo ""
        full_output=$(keytool -list -v -keystore my-release-key.keystore -alias jingxunianjing -storepass "${{ secrets.KEYSTORE_PASSWORD }}" || true)
        
        sha1_with_colons=$(echo "$full_output" | grep -i "sha1:" | head -1 | sed 's/.*sha1:\s*//i' | sed 's/\s*$//')
        sha256_with_colons=$(echo "$full_output" | grep -i "sha256:" | head -1 | sed 's/.*sha256:\s*//i' | sed 's/\s*$//')
        md5_with_colons=$(echo "$full_output" | grep -i "md5:" | head -1 | sed 's/.*md5:\s*//i' | sed 's/\s*$//')
        
        echo "===== 证书指纹 ====="
        echo "     SHA1: $sha1_with_colons"
        echo "     SHA256: $sha256_with_colons"
        echo "===================="
        echo ""
        echo "===== MD5 指纹 ====="
        echo "$md5_with_colons"
        echo "===================="
        echo ""
        echo "===== SHA1 指纹（小米应用商店用）====="
        echo "$sha1_with_colons"
        echo "======================================="
        echo ""
        echo "===== 去掉冒号的 SHA1（直接复制）====="
        sha1_without_colons=$(echo "$sha1_with_colons" | tr -d ":")
        echo "$sha1_without_colons"
        echo "======================================="
        echo ""
        echo "===== 公钥信息 ====="
        echo "Certificate fingerprints:"
        echo "     SHA1: $sha1_with_colons"
        echo "     SHA256: $sha256_with_colons"
        signature_algorithm=$(echo "$full_output" | grep -i "Signature algorithm name" | head -1 | sed 's/.*://' | sed 's/\s*$//')
        echo "Signature algorithm name: $signature_algorithm"
        echo "============================="

    - name: Build Android Release APK
      if: steps.create_keystore.outputs.ready == 'true'
      run: |
        cd android
        # 关键：传给 AGP 的 store.file 必须用【绝对路径】
        # 之前传相对路径 `my-release-key.keystore` 时，AGP 会按 :app 模块目录(android/app/)解析
        # → 期望 android/app/my-release-key.keystore（不存在！）
        # 但 keystore 实际在 android/my-release-key.keystore（与 build.gradle 的 file('../my-release-key.keystore') 一致）
        KS_ABS="$PWD/my-release-key.keystore"
        echo "=== Building Release APK ==="
        echo "    keystore absolute path = $KS_ABS"
        ls -la "$KS_ABS"
        ./gradlew clean
        ./gradlew assembleRelease --no-build-cache --no-daemon \
          -Pandroid.injected.signing.store.file="$KS_ABS" \
          -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
          -Pandroid.injected.signing.key.alias=jingxunianjing \
          -Pandroid.injected.signing.key.password="${{ secrets.KEYSTORE_PASSWORD }}"
        ls -la app/build/outputs/apk/release/ 2>/dev/null || true

    - name: Build Android Debug APK
      run: |
        cd android
        ./gradlew assembleDebug
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: Upload Release APK
      if: hashFiles('android/app/build/outputs/apk/release/app-release.apk') != ''
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
